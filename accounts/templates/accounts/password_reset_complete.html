{% extends 'base.html' %}

{% block title %}رمز عبور تغییر کرد | {{ site_name }}{% endblock %}

{% block content %}
    <main class="fm-auth-page">
        <div class="container">
            <div class="fm-auth">
                <div class="fm-auth__card">
                    <div class="fm-auth__head">
                        <div class="fm-auth__icon"><i class="fa fa-circle-check" aria-hidden="true"></i></div>
                        <h1>رمز عبور تغییر کرد</h1>
                        <p>رمز عبور جدیدتان ذخیره شد. حالا می‌توانید با آن وارد شوید.</p>
                    </div>
                    <p class="fm-auth__alt">
                        <a href="{% url 'account:login' %}">ورود به حساب کاربری</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
