{% comment %}
سربرگ کشوی منوی کناری (فقط در موبایل/تبلت دیده می‌شود): عنوان + دکمهٔ بستن.
ستون کناری با aria-labelledby="{{ target }}-title" به همین عنوان نام‌گذاری می‌شود.

پارامترها: target (id کشو)، title، icon (کلاس Font Awesome؛ پیش‌فرض fa-bars)
{% endcomment %}
<div class="fm-side__head">
    <p class="fm-side__title" id="{{ target }}-title"><i class="fa {{ icon|default:'fa-bars' }}" aria-hidden="true"></i> {{ title }}</p>
    <button type="button" class="fm-side__close" data-fm-drawer-close aria-label="بستن {{ title }}"><i class="fa fa-xmark" aria-hidden="true"></i></button>
</div>
